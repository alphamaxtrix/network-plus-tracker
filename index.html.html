<style>
  :root{
    --bg:#0a0d10;
    --panel:#11161b;
    --panel-alt:#161d24;
    --border:#212a32;
    --text:#dde5ec;
    --text-dim:#7c8a97;
    --accent:#35e0a1;
    --accent-dim:rgba(53,224,161,0.14);
    --amber:#ffb454;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  #np-root{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--border);
    min-height:640px;
    display:flex;
    flex-direction:column;
  }
  .np-topbar{
    padding:18px 22px 16px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--panel-alt), var(--panel));
  }
  .np-topbar-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .np-title{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .np-title strong{color:var(--accent); font-weight:600;}
  .np-stats{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    display:flex;
    gap:16px;
  }
  .np-stats b{color:var(--text); font-weight:600;}
  .np-linkbar{
    margin-top:12px;
    height:8px;
    border-radius:4px;
    background:var(--panel-alt);
    border:1px solid var(--border);
    overflow:hidden;
    position:relative;
  }
  .np-linkbar-fill{
    height:100%;
    background:linear-gradient(90deg, #1f9d75, var(--accent));
    width:0%;
    transition:width 0.4s ease;
  }
  .np-body{
    display:flex;
    flex:1;
    min-height:0;
  }
  .np-nav{
    width:220px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    background:var(--panel);
    padding:10px;
    overflow-y:auto;
  }
  .np-nav-item{
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:4px;
    transition:background 0.15s;
  }
  .np-nav-item:hover{background:var(--panel-alt);}
  .np-nav-item.active{background:var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent);}
  .np-nav-label{
    font-size:13px;
    font-weight:600;
    color:var(--text);
    margin-bottom:5px;
  }
  .np-nav-item.active .np-nav-label{color:var(--accent);}
  .np-nav-bar{
    height:4px;
    border-radius:2px;
    background:var(--border);
    overflow:hidden;
  }
  .np-nav-bar-fill{
    height:100%;
    background:var(--accent);
  }
  .np-nav-count{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-dim);
    margin-top:5px;
  }
  .np-main{
    flex:1;
    overflow-y:auto;
    padding:20px 24px 28px;
  }
  .np-section-head{
    font-size:19px;
    font-weight:700;
    margin:0 0 2px;
  }
  .np-section-sub{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:18px;
  }
  .np-subsection{
    margin-bottom:22px;
  }
  .np-subsection-title{
    font-family:var(--mono);
    font-size:12px;
    color:var(--amber);
    letter-spacing:0.04em;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px dashed var(--border);
  }
  .np-video-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .np-video-row:hover{background:var(--panel-alt);}
  .np-check{
    width:18px;
    height:18px;
    flex-shrink:0;
    border-radius:5px;
    border:1.5px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.15s;
  }
  .np-check.done{
    background:var(--accent);
    border-color:var(--accent);
  }
  .np-check.done svg{display:block;}
  .np-check svg{display:none; width:11px; height:11px;}
  .np-video-title{
    flex:1;
    font-size:14px;
    color:var(--text);
  }
  .np-video-row.done .np-video-title{
    color:var(--text-dim);
    text-decoration:line-through;
    text-decoration-color:var(--border);
  }
  .np-video-dur{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    width:44px;
    text-align:right;
    flex-shrink:0;
  }
  .np-video-link{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    text-decoration:none;
    padding:3px 7px;
    border:1px solid var(--border);
    border-radius:5px;
    flex-shrink:0;
  }
  .np-video-link:hover{color:var(--accent); border-color:var(--accent);}
  .np-footer{
    padding:10px 22px;
    border-top:1px solid var(--border);
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .np-reset{
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:11px;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .np-reset:hover{color:var(--amber); border-color:var(--amber);}
  @media (max-width:640px){
    .np-body{flex-direction:column;}
    .np-nav{width:100%; display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--border);}
    .np-nav-item{min-width:130px;}
  }
</style>

        {t:"Software Tools", d:"7:29", u:"https://www.professormesser.com/network-plus/n10-009/n10-009-video/software-tools-n10-009/"},
        {t:"Command Line Tools", d:"17:59", u:"https://www.professormesser.com/network-plus/n10-009/n10-009-video/command-line-tools-n10-009/"},
        {t:"Hardware Tools", d:"8:40", u:"https://www.professormesser.com/network-plus/n10-009/n10-009-video/hardware-tools-n10-009/"},
        {t:"Basic Network Device Commands", d:"8:56", u:"https://www.professormesser.com/network-plus/n10-009/n10-009-video/basic-network-device-commands-n10-009/"}
      ]}
    ]}
  ];

  // give every video a stable unique id
  let vidCounter = 0;
  DATA.forEach(sec => sec.subs.forEach(sub => sub.v.forEach(vid => { vid.id = "v" + (vidCounter++); })));

  function toSeconds(d){
    const parts = d.split(":").map(Number);
    return parts[0]*60 + parts[1];
  }
  function fmtHM(totalSeconds){
    const h = Math.floor(totalSeconds/3600);
    const m = Math.round((totalSeconds%3600)/60);
    if(h > 0) return h + "h " + m + "m";
    return m + "m";
  }

  const ALL_VIDEOS = [];
  DATA.forEach(sec => sec.subs.forEach(sub => sub.v.forEach(vid => ALL_VIDEOS.push(vid))));
  const TOTAL_COUNT = ALL_VIDEOS.length;
  const TOTAL_SECONDS = ALL_VIDEOS.reduce((s,v)=>s+toSeconds(v.d),0);

  let completed = {};
  let activeSection = 0;

  const navEl = document.getElementById('np-nav');
  const mainEl = document.getElementById('np-main');
  const topstatsEl = document.getElementById('np-topstats');
  const linkfillEl = document.getElementById('np-linkfill');
  const footstatEl = document.getElementById('np-footstat');
  const resetBtn = document.getElementById('np-reset');

  const checkSvg = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.7L13 4.5" stroke="#0a0d10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function sectionStats(sec){
    let total=0, done=0;
    sec.subs.forEach(sub => sub.v.forEach(v => { total++; if(completed[v.id]) done++; }));
    return {total, done};
  }

  function renderNav(){
    navEl.innerHTML = '';
    DATA.forEach(sec => {
      const {total, done} = sectionStats(sec);
      const pct = total ? Math.round(done/total*100) : 0;
      const item = document.createElement('div');
      item.className = 'np-nav-item' + (sec.id === activeSection ? ' active' : '');
      item.innerHTML = `
        <div class="np-nav-label">${sec.id}. ${sec.title}</div>
        <div class="np-nav-bar"><div class="np-nav-bar-fill" style="width:${pct}%"></div></div>
        <div class="np-nav-count">${done}/${total} videos</div>
      `;
      item.addEventListener('click', () => { activeSection = sec.id; render(); });
      navEl.appendChild(item);
    });
  }

  function renderMain(){
    const sec = DATA.find(s => s.id === activeSection);
    const {total, done} = sectionStats(sec);
    let html = `<div class="np-section-head">${sec.id}. ${sec.title}</div>
      <div class="np-section-sub">${done} of ${total} complete</div>`;
    sec.subs.forEach(sub => {
      html += `<div class="np-subsection"><div class="np-subsection-title">${sub.t}</div>`;
      sub.v.forEach(v => {
        const isDone = !!completed[v.id];
        html += `
          <div class="np-video-row ${isDone?'done':''}" data-id="${v.id}">
            <div class="np-check ${isDone?'done':''}">${isDone?checkSvg:''}</div>
            <div class="np-video-title">${v.t}</div>
            <div class="np-video-dur">${v.d}</div>
            <a class="np-video-link" href="${v.u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">watch</a>
          </div>`;
      });
      html += `</div>`;
    });
    mainEl.innerHTML = html;
    mainEl.querySelectorAll('.np-video-row').forEach(row => {
      row.addEventListener('click', () => {
        const id = row.getAttribute('data-id');
        completed[id] = !completed[id];
        saveProgress();
        render();
      });
    });
  }

  function renderTop(){
    const doneCount = ALL_VIDEOS.filter(v => completed[v.id]).length;
    const doneSeconds = ALL_VIDEOS.filter(v => completed[v.id]).reduce((s,v)=>s+toSeconds(v.d),0);
    const pct = Math.round(doneCount/TOTAL_COUNT*100);
    topstatsEl.innerHTML = `<span><b>${doneCount}</b>/${TOTAL_COUNT} videos</span><span><b>${pct}%</b> complete</span>`;
    linkfillEl.style.width = pct + '%';
    const remaining = TOTAL_SECONDS - doneSeconds;
    footstatEl.textContent = `${fmtHM(doneSeconds)} watched · ${fmtHM(remaining)} remaining of ${fmtHM(TOTAL_SECONDS)} total`;
  }

  function render(){
    renderNav();
    renderMain();
    renderTop();
  }

  function saveProgress(){
    try{
      localStorage.setItem('n10009-progress', JSON.stringify(completed));
    }catch(e){
      console.error('Failed to save progress', e);
    }
  }

  function loadProgress(){
    try{
      const raw = localStorage.getItem('n10009-progress');
      if(raw){
        completed = JSON.parse(raw);
      }
    }catch(e){
      // no saved progress yet
    }
    render();
  }

  resetBtn.addEventListener('click', () => {
    if(confirm('Reset all progress on this tracker?')){
      completed = {};
      saveProgress();
      render();
    }
  });

  loadProgress();
})();
</script>
